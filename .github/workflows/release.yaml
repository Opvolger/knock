name: Build release

on:
  push:
    branches:
      - 'master'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

jobs:
  build:
    name: Build tar.gz files
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always)-dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,riscv64,arm
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build tar.gz files
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          push: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=./output
      - name: Collect tar.gz files
        run: |
          mkdir dist
          find output -name '*.tar.gz' -exec mv {} dist/ \;
          ls -l dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: knock-${{ steps.version.outputs.version }}
          path: dist/*.tar.gz

  release:
    name: Create GitHub release
    needs: [build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check tag is on master
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit on master"
            exit 1
          fi
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: knock-${{ needs.build.outputs.version }}
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; cat ChangeLog; echo '```'; } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
